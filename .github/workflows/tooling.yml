name: Keycloak tooling
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Install verified Java and Maven distributions
        timeout-minutes: 12
        run: |
          bash scripts/install-java.sh
          bash scripts/install-maven.sh
      - run: bash scripts/check-tooling.sh
      - name: Qualify native closure tooling in a disposable realm
        run: bash scripts/check-native.sh
